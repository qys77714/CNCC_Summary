[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cncc-minutes"
version = "1.0.0"
description = "中文长会议视频：多 GPU ASR、可追溯纠错和会议纪要"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx==0.28.1", "python-dotenv==1.1.1", "pydantic>=2.11,<3",
  "numpy>=2.0,<2.4", "soundfile>=0.13,<0.15", "imageio-ffmpeg==0.6.0",
]

[project.optional-dependencies]
gpu = ["qwen-asr==0.0.6"]
speakers = ["pyannote.audio==4.0.3"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
cncc-minutes = "cncc_minutes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
